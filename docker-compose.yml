services:
  postgres:
    image: postgres:16
    container_name: bright-tracker-postgres
    environment:
      POSTGRES_DB: bright_tracker
      POSTGRES_USER: bright_tracker
      POSTGRES_PASSWORD: bright_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: bright-tracker-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

volumes:
  postgres_data:
