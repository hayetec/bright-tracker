services:
  postgres:
    image: postgres:16
    container_name: bright-tracker-postgres
    environment:
      POSTGRES_DB: bright_tracker
      POSTGRES_USER: bright_tracker
      POSTGRES_PASSWORD: bright_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
